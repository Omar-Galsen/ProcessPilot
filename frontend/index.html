<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ProcessPilot AI</title>
<style>body{font-family:system-ui;background:#101827;color:#f2f5fb;max-width:850px;margin:40px auto;padding:20px}section{background:#1c2940;padding:24px;border-radius:16px;margin:16px 0}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #61738d}button{background:#42b5a4;color:#07131b;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><h1>ProcessPilot AI</h1><p>Engineering learning assistant · prototype</p>
<section><h2>Ask Dify</h2><textarea id="question" placeholder="Explain the Darcy-Weisbach equation"></textarea><button onclick="ask()">Ask AI</button><pre id="answer"></pre></section>
<section><h2>Pipe pressure drop</h2><label>Length (m)<input id="length" type="number" value="100"></label><label>Diameter (m)<input id="diameter" type="number" value="0.1"></label><label>Velocity (m/s)<input id="velocity" type="number" value="2"></label><label>Density (kg/m³)<input id="density" type="number" value="1000"></label><label>Viscosity (Pa·s)<input id="viscosity" type="number" value="0.001"></label><button onclick="calc()">Calculate</button><pre id="result"></pre></section>
<script>
const API='http://localhost:8000';let conversation_id='';
async function request(path,data){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}
async function ask(){const el=document.getElementById('answer');el.textContent='Thinking...';try{const j=await request('/chat',{question:document.getElementById('question').value,conversation_id});conversation_id=j.conversation_id;el.textContent=j.answer}catch(e){el.textContent=e.message}}
async function calc(){const el=document.getElementById('result');try{const j=await request('/calculate/pipe',{length_m:+document.getElementById('length').value,diameter_m:+document.getElementById('diameter').value,velocity_m_s:+document.getElementById('velocity').value,density_kg_m3:+document.getElementById('density').value,viscosity_pa_s:+document.getElementById('viscosity').value});el.textContent=JSON.stringify(j,null,2)}catch(e){el.textContent=e.message}}
</script></body></html>
