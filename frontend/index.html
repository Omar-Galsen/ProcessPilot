<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ProcessPilot AI</title>
<style>body{font-family:system-ui;background:#101827;color:#f2f5fb;max-width:850px;margin:40px auto;padding:20px}section{background:#1c2940;padding:24px;border-radius:16px;margin:16px 0}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #61738d}button{background:#42b5a4;color:#07131b;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border-radius:12px;margin:10px 0;background:#263a54}.bubble.student{background:#145c5b;margin-left:15%}.secondary{background:#32445f;color:white}#messages{max-height:420px;overflow-y:auto}</style></head>
<body><h1>ProcessPilot AI</h1><p>Engineering learning assistant · prototype</p>
<section><h2>Learning Chat</h2><p>Choose a subject and how you want to learn.</p><label>Topic<select id="topic"><option>Fluid Mechanics</option><option>Thermodynamics</option><option>Heat Transfer</option><option>Mass Transfer</option><option>Process Control</option><option>Reaction Engineering</option><option>General chemical engineering</option></select></label><label>Learning mode<select id="mode" onchange="newChat()"><option value="teach">Teach step by step</option><option value="quiz">Quiz me</option><option value="guided">Guide my solution</option></select></label><div id="messages" aria-live="polite"></div><textarea id="question" placeholder="What would you like to learn?"></textarea><button id="send" onclick="ask()">Send message</button><button class="secondary" onclick="newChat()">New conversation</button></section>
<section><h2>Pipe pressure drop</h2><label>Length (m)<input id="length" type="number" value="100"></label><label>Diameter (m)<input id="diameter" type="number" value="0.1"></label><label>Velocity (m/s)<input id="velocity" type="number" value="2"></label><label>Density (kg/m³)<input id="density" type="number" value="1000"></label><label>Viscosity (Pa·s)<input id="viscosity" type="number" value="0.001"></label><button onclick="calc()">Calculate</button><pre id="result"></pre></section>
<script>
const API=window.location.origin;let conversation_id='';
async function request(path,data){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');return j}
function addMessage(text,role){const el=document.createElement('div');el.className='bubble '+role;el.textContent=text;document.getElementById('messages').appendChild(el);el.scrollIntoView({block:'nearest'});return el}
function newChat(){conversation_id='';document.getElementById('messages').replaceChildren();document.getElementById('question').value=''}
document.getElementById('topic').addEventListener('change',newChat);
async function ask(){const input=document.getElementById('question');const question=input.value.trim();if(!question)return;const button=document.getElementById('send');button.disabled=true;addMessage(question,'student');input.value='';const pending=addMessage('Thinking...','tutor');try{const j=await request('/chat',{question,conversation_id,mode:document.getElementById('mode').value,topic:document.getElementById('topic').value});conversation_id=j.conversation_id;pending.textContent=j.answer||'No response received.'}catch(e){pending.textContent='Error: '+e.message}finally{button.disabled=false}}
async function calc(){const el=document.getElementById('result');try{const j=await request('/calculate/pipe',{length_m:+document.getElementById('length').value,diameter_m:+document.getElementById('diameter').value,velocity_m_s:+document.getElementById('velocity').value,density_kg_m3:+document.getElementById('density').value,viscosity_pa_s:+document.getElementById('viscosity').value});el.textContent=JSON.stringify(j,null,2)}catch(e){el.textContent=e.message}}
</script></body></html>
